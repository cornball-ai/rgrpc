name: ci

on:
  push:
  pull_request:

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    # ubuntu-latest is noble, the release the docker/ ABI pairing
    # targets. macos-latest builds against Homebrew's gRPC — a much
    # newer release than any distro's — so the pair brackets the
    # version range CRAN's builders span. The stub leg installs no gRPC,
    # as on CRAN's macOS builders, and checks the stub build passes.
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, grpc: system}
          - {os: macos-latest, grpc: system}
          - {os: ubuntu-latest, grpc: none}

    runs-on: ${{ matrix.os }}

    env:
      # legs with gRPC must fail rather than quietly build the stub
      RGRPC_REQUIRE_GRPC: ${{ matrix.grpc == 'system' }}

    steps:
      - uses: actions/checkout@v6

      - name: System dependencies (Linux)
        if: runner.os == 'Linux' && matrix.grpc == 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgrpc++-dev libprotobuf-dev pkgconf

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        # checkbashisms: without it a --as-cran check warns that the
        # configure check is incomplete
        run: brew install grpc protobuf pkgconf checkbashisms

      - name: Setup
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        # install_all includes Suggests: RProtoBuf and tinytest, so the
        # typed/proto tests run instead of skipping.
        run: ./run.sh install_all

      - name: Test
        run: ./run.sh run_tests

      - name: No check warnings
        # run_tests fails only on ERRORs
        run: |
          grep -E "^Status" ./*.Rcheck/00check.log
          ! grep -qE "^Status: .*WARNING" ./*.Rcheck/00check.log

      - name: At-home suite
        # R CMD check runs tinytest with at_home = FALSE, which skips
        # every server-bind test (streaming, TLS, shutdown stress).
        # This step installs the checkout and runs the full suite with
        # at_home = TRUE, failing on any failed expectation.
        run: |
          mkdir -p "$HOME/Rlib"
          R CMD INSTALL -l "$HOME/Rlib" .
          Rscript -e '.libPaths(c(file.path(Sys.getenv("HOME"), "Rlib"), .libPaths())); library(rgrpc); stopifnot(grpc_available() == (Sys.getenv("RGRPC_REQUIRE_GRPC") == "true")); res <- tinytest::run_test_dir("inst/tinytest"); print(res); stopifnot(tinytest::all_pass(res))'
