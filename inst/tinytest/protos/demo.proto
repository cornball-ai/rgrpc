syntax = "proto3";
package demo;

message Ping { string msg = 1; }
message Pong {
  string msg = 1;
  uint32 n = 2;
}

service Echo {
  rpc Say (Ping) returns (Pong);
  rpc Watch (Ping) returns (stream Pong);
  rpc Collect (stream Ping) returns (Pong);
  rpc Chat (stream Ping) returns (stream Pong);
}
